name: Deploy GSS Express Server

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Login to docker hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker Image
        run: docker build -t muhammadyusuf2766/gssiot-dashboard-backend.24.05.2026:latest -f DockerFile .

      - name: Publish Image to docker hub
        run: docker push muhammadyusuf2766/gssiot-dashboard-backend.24.05.2026:latest

      - name: Remove unused Docker images
        run: docker system prune -af

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Pull image from docker hub
        run: docker pull muhammadyusuf2766/gssiot-dashboard-backend.24.05.2026:latest

      - name: Delete old container
        run: docker rm -f nodejs-app-container || true

      - name: Run Docker Container
        run: |
          docker run -d -p 3000:3000 --name nodejs-app-container \
            -e AWS_ACCESS_KEY_ID='${{ secrets.AWS_ACCESS_KEY_ID }}' \
            -e AWS_REGION='${{ secrets.AWS_REGION }}' \
            -e AWS_SECRET_ACCESS_KEY='${{ secrets.AWS_SECRET_ACCESS_KEY }}' \
            -e MONGO_URI='${{ secrets.MONGO_URI }}' \
            -e JWT_SECRET_KEY='${{ secrets.JWT_SECRET_KEY }}' \
            -e JWT_EXPIRES_IN='${{ secrets.JWT_EXPIRES_IN }}' \
            -e TELEGRAM_BOT_TOKEN='${{ secrets.TELEGRAM_BOT_TOKEN }}' \
            -e NODE_ENV='${{ secrets.NODE_ENV }}' \
            -e OWM_API_KEY='${{ secrets.OWM_API_KEY }}' \
            -e S3_BUCKET_PROD='${{ secrets.S3_BUCKET_PROD }}' \
            muhammadyusuf2766/gssiot-dashboard-backend.24.05.2026:latest
